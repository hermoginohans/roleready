services:
  - type: web
    name: roleready
    runtime: node
    plan: free
    buildCommand: npm run build && npm run validate
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
